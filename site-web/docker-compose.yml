# The marketing site plus the text server that powers its live demo.
#
# Deployed to /opt/gss-site on the VPS as its own compose project, so rebuilding
# the site can never interrupt a live call — the voice assistant is a separate
# project and is not referenced here.
#
#   cd /opt/gss-site && docker compose up -d --build
#
# Confirm the proxy network name first:  docker network ls
services:
  site:
    build: .
    restart: unless-stopped
    depends_on:
      - text-app
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NETWORK:-root_default}"
      - "traefik.http.routers.gsssite.rule=Host(`${SITE_HOSTNAME:-reception.rileygramlich.dev}`)"
      - "traefik.http.routers.gsssite.entrypoints=websecure"
      - "traefik.http.routers.gsssite.tls=true"
      - "traefik.http.routers.gsssite.tls.certresolver=${CERT_RESOLVER:-mytlschallenge}"
      - "traefik.http.services.gsssite.loadbalancer.server.port=80"

  # Answers /api/demo for the site, and the Twilio webhooks for the text
  # product. Deliberately NOT on the proxy network and NOT labelled for Traefik:
  # nothing reaches it except through nginx, or through the separate hostname
  # you give Twilio if you run the webhooks here too.
  text-app:
    build:
      context: ..
      dockerfile: Dockerfile
    command: node src/server-text.js
    restart: unless-stopped
    env_file: ../.env
    environment:
      PORT: 3001
      CALL_LOG: /app/data/calls.jsonl
      OUTBOUND_STORE: /app/data/outbound.json
      OPTOUT_STORE: /app/data/optout.json
    volumes:
      # Tenant configs live on the host so onboarding is a file drop plus a
      # restart. Outbound jobs and the opt-out list must survive a redeploy —
      # losing the suppression list means texting people who unsubscribed.
      - ../src/config:/app/src/config:ro
      - ../data:/app/data
    networks:
      - internal
    expose:
      - "3001"
    # The base image's healthcheck probes :3000, which is the voice server's
    # port. This container runs the text server on :3001, so without overriding
    # it the container is permanently unhealthy and restart-looped.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-root_default}
  internal:
    driver: bridge
