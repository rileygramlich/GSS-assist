server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # The live demo. nginx owns the split rather than Traefik so the whole site
    # needs one router and one hostname; the text server is never exposed
    # directly. Long read timeout because a tool loop that hits the calendar can
    # take a few seconds, and a demo that times out mid-answer looks broken.
    location /api/ {
        proxy_pass         http://text-app:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # The demo's per-visitor rate limit keys on this. Without it every
        # visitor looks like the same container IP and one person exhausts
        # everybody's allowance.
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }

    # Vite fingerprints these filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must not be cached, or a deploy leaves visitors on old asset URLs.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # /text, /both and /demo are client-side routes with no file behind them.
    # Without this they 404 on a direct hit or a refresh — which is exactly how
    # every ad click and every link you text a prospect arrives.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
